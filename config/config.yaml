version: 0.16-0

mqtt:
  enabled: false  # not using HA/MQTT; avoid connection spam

detectors:
  cpu1:
    type: cpu      # Windows + Docker, no GPU passthrough

record:
  enabled: true
  retain:
    days: 1
    mode: motion   # motion-only segments (no 24/7)

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  retain:
    default: 7

cameras:
  appartment_entrance:
    ffmpeg:
      inputs:
        - path: rtsp://localu:Messina1@192.168.1.6:554/Streaming/Channels/102
          roles: [detect, record]
          input_args: preset-rtsp-generic  # TCP for Hikvision
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 15            # reduce CPU and silence warning
    motion:
      enabled: true
    objects:
      track: [person, car, bicycle]

  appartment_balcony:
