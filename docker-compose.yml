# version: "3.9"
services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    privileged: true
    cpus: "6.0"                 # its max CPU
    cpu_shares: 2048            # > others => wins on contention
    mem_limit: "6g"             # hard cap
    mem_reservation: "3g"       # soft guarantee; scheduler favors it
    oom_score_adj: -500         # less likely to be OOM-killed
    shm_size: "512mb"           # ffmpeg headroom
    # HW accel is optional; comment "devices" if not using Intel/AMD iGPU
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./config:/config
      - ./media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"   # Frigate UI http://localhost:5000
      - "8554:8554"   # RTSP (optional)
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      FRIGATE_RTSP_PASSWORD: "password"

  sqlite-backup:
    image: nouchka/sqlite3:latest
    container_name: sqlite-backup
    restart: unless-stopped
    entrypoint: ["sleep","infinity"]
    cpus: "0.5"            # don’t let it burst too hard
    cpu_shares: 32         # way lower than Frigate
    mem_limit: "512m"
    mem_reservation: "128m"
    oom_score_adj: 300
    # (Optional if supported in your WSL2 build)
    volumes:
      - ./config:/config
    labels:
      ofelia.enabled: "true"

  rclone-runner:
    image: rclone/rclone:latest
    container_name: rclone-runner
    restart: unless-stopped
    entrypoint: ["sleep","infinity"]
    env_file:
      - ./.env.secrets 
    cpus: "1.0"            # don’t let it burst too hard
    cpu_shares: 64         # way lower than Frigate
    mem_limit: "512m"
    mem_reservation: "128m"
    oom_score_adj: 300
    # (Optional if supported in your WSL2 build)
    environment:
      # Optional but useful defaults:
      RCLONE_S3_ACL: "private"
      RCLONE_S3_NO_CHECK_BUCKET: "true"
    volumes:
      - ./config:/config:ro
      - ./media:/media/frigate:ro
    labels:
      ofelia.enabled: "true"

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: unless-stopped
    command: daemon --docker
    depends_on:
      - rclone-runner
      - sqlite-backup
    cpus: "0.5"
    cpu_shares: 32
    mem_limit: "256m"
    mem_reservation: "64m"
    oom_score_adj: 500
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.enabled: "true"

            # --- DB snapshot ---
      ofelia.job-exec.dbbackup.schedule: "5 * * * * *"
      ofelia.job-exec.dbbackup.no-overlap: "true"
      ofelia.job-exec.dbbackup.container: "sqlite-backup"
      ofelia.job-exec.dbbackup.user: "0"
      ofelia.job-exec.dbbackup.command: "sh -lc '/config/scripts/db-backup.sh'"

      # --- CONFIG copy ---
      ofelia.job-exec.config.schedule: "20 * * * * *"
      ofelia.job-exec.config.no-overlap: "true"
      ofelia.job-exec.config.container: "rclone-runner"
      ofelia.job-exec.config.user: "0"
      ofelia.job-exec.config.command: "sh -lc '/config/scripts/rclone-config.sh'"

      # --- MEDIA copy ---
      ofelia.job-exec.media.schedule: "40 * * * * *"
      ofelia.job-exec.media.no-overlap: "true"
      ofelia.job-exec.media.container: "rclone-runner"
      ofelia.job-exec.media.user: "0"
      ofelia.job-exec.media.command: "sh -lc '/config/scripts/rclone-media.sh'"
